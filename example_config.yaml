google_sheets:
  spreadsheet_id: "your_google_spreadsheet_id_here"
  worksheet_name: "Sheet1"
  columns:
    job_title: "Job Title"
    url: "URL"
    status: "Status"
    details: "Details"
    priority: "Priority"
    reasoning: "Reasoning"

ollama:
  host: "https://ollama.com"
  model: "gemini-3-flash-preview:cloud"   # any model on your Ollama account (used for resume/cover letter generation)
  parser_model: "nemotron-3-nano:30b"     # lightweight model for job description parsing (falls back to model if omitted)
  temperature: 0.3
  max_retries: 3

paths:
  resume_yaml: "resume.yaml"
  output_dir: "output"
  credentials: "credentials/google_service_account.json"

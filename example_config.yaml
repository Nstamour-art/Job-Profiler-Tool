google_sheets:
  spreadsheet_id: "your_google_spreadsheet_id_here"
  worksheet_name: "Sheet1"
  columns:
    job_title: "Job Title"
    url: "URL"
    status: "Status"
    details: "Details"
    priority: "Priority"
    reasoning: "Reasoning"

llm:
  temperature: 0.3
  max_retries: 3

  # Default model used when --provider local (no flag) — must be available in your local Ollama install
  model: "llama3.2:latest"
  parser_model: "llama3.2:latest"

  # Per-provider model overrides — used when --provider <name> is passed
  cloud:                                   # --provider cloud  (Ollama Cloud, requires OLLAMA_API_KEY)
    host: "https://ollama.com"
    model: "gpt-oss:120b"
    parser_model: "nemotron-3-nano:30b"

  openai:                                  # --provider openai  (requires OPENAI_API_KEY)
    model: "gpt-4o"
    parser_model: "gpt-4o-mini"

  anthropic:                               # --provider anthropic  (requires ANTHROPIC_API_KEY)
    model: "claude-opus-4-6"
    parser_model: "claude-haiku-4-5-20251001"

  gemini:                                  # --provider gemini  (requires GEMINI_API_KEY)
    model: "gemini-2.5-pro-preview-03-25"
    parser_model: "gemini-2.0-flash"

paths:
  resume_yaml: "resume.yaml"
  output_dir: "output"
  credentials: "credentials/google_service_account.json"
